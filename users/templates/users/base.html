<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일자리 매칭 플랫폼</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- 상단 네비게이션바 -->
    <nav class="bg-slate-900 text-white shadow-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- 로고 영역 -->
                <div class="flex-shrink-0 flex items-center">
                    <a href="{% url 'home' %}" class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        <span class="bg-blue-600 text-white px-2.5 py-1 rounded-lg text-sm font-black">JOB</span>
                        <span>일자리플랫폼</span>
                    </a>
                </div>

                <!-- 로그인 상태에 따른 동적 버튼 -->
                <div class="flex items-center gap-3">
                    {% if user.is_authenticated %}
                        <span class="text-sm font-medium text-slate-300 hidden sm:inline-block">
                            <strong class="text-white">{{ user.username }}</strong>님 환영합니다!
                        </span>
                        <a href="{% url 'logout' %}" class="inline-flex items-center justify-center h-10 px-4 text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg transition-colors border border-slate-700">
                            로그아웃
                        </a>
                    {% else %}
                        <a href="{% url 'login' %}" class="inline-flex items-center justify-center h-10 px-4 text-sm font-semibold text-slate-200 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                            로그인
                        </a>
                        <a href="{% url 'signup' %}" class="inline-flex items-center justify-center h-10 px-4 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-500 rounded-lg shadow-sm transition-colors">
                            간편가입
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}
        {% endblock %}
    </main>

    <!-- 하단 푸터 -->
    <footer class="bg-slate-900 text-slate-400 border-t border-slate-800 mt-auto py-6">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm">
            <p>© 2026 일자리 매칭 플랫폼. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>

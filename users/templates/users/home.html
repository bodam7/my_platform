{% extends 'users/base.html' %}
{% block content %}
<main class="w-full px-3 sm:px-6 lg:px-8 py-2 mx-auto">

  <!-- 업종별 찾기 섹션 -->
  <section class="mb-2">
    <!-- 제목 및 안내 문구 -->
    <div class="flex items-center gap-2 whitespace-nowrap mb-2">
      <h2 class="text-base sm:text-lg font-bold text-slate-900 flex items-center gap-1 shrink-0">
        📌 업종별 찾기
      </h2>
      <span class="animate-pulse text-[10px] sm:text-xs font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-100 truncate">
        ✨ 아래 이미지를 클릭하세요!
      </span>
    </div>

    {% if categories %}
    <!-- PC 4열(2줄) / 모바일 2열(4줄) 반응형 그리드 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-3">
      {% for category in categories %}
      <a href="#" class="group block bg-white rounded-lg p-1 shadow-sm hover:shadow-md transition duration-200 border border-slate-100">
        <!-- aspect-[4/3]을 적용해 세로 길이를 축소 (하단 잘림 방지) -->
        <div class="relative w-full aspect-[4/3] overflow-hidden rounded-md bg-slate-100 flex items-center justify-center">
          {% if category.image %}
          <img src="{{ category.image.url }}" 
               alt="{{ category.name }} 구인구직 일자리 채용정보" 
               title="{{ category.name }}" 
               class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
          {% else %}
          <i class="fa-solid fa-briefcase text-base md:text-xl text-slate-400"></i>
          {% endif %}
        </div>
        <!-- 텍스트 상하 여백 최소화 -->
        <div class="py-0.5 text-center">
          <span class="font-bold text-slate-800 text-xs sm:text-sm block truncate">
            {{ category.name }}
          </span>
        </div>
      </a>
      {% endfor %}
    </div>
    {% endif %}
  </section>

</main>
{% endblock %}
